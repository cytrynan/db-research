services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dbr_pg
    # 落ちたら起こす（2026-10-13 に exit 255 で止まったまま誰も気づかなかった）。手で stop した時は起こさない。
    # 「稼働中なのに応答しない」は救えない＝常駐の DB-UNREACHABLE.flag で検知する（D-20）
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbr
      POSTGRES_PASSWORD: dbr
      POSTGRES_DB: dbr
    # 個人データを置く DB なので、ホストのループバックにだけ公開する（D-5）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbr_pg:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbr -d dbr"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbr_pg:
