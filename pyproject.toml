[project]
name = "db-research"
version = "0.1.0"
description = "K の個人記録を質問の型で振り分けて検索する PostgreSQL 基盤の研究"
authors = [{ name = "cytrynan" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "pyyaml>=6",
]

[project.scripts]
dbr = "dbr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbr"]

[tool.pytest.ini_options]
# ユニットテストはスライス内（src/）に同居、統合は tests/integration（-m db）
testpaths = ["src", "tests"]
# 既定はユニットのみ。カバレッジ 80% の判定は全テスト（db 含む）で行う:
#   uv run pytest -m "db or not db" --cov-fail-under=80
addopts = "--cov=src --cov-report=term --cov-report=html -m 'not db and not e2e and not slow'"
markers = [
    "db: Docker の PostgreSQL が要る統合テスト（未起動は失敗させる）",
    "e2e: bench の再現性テスト",
    "slow: 埋め込みモデルを実際に動かすテスト",
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["build/", "dist/", ".steering/"]
